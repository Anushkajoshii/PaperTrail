# PaperTrail golden set v2: SEBI rulebook flags (52 sentences; v1 was r01-r32)
# Note: v2 sentences r33-r52 were written alongside fixes to the rules, so the rulebook set is
# no longer a held-out test for the rules (see docs/EVALUATION.md).
#
# Each sentence lists the verified-rule flag kinds it SHOULD raise (empty list = none).
# Registration is assumed "not found" unless `registered: true`.
# Negatives include tricky look-alikes ("no guarantees", "registered for a marathon").


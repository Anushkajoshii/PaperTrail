      auto stocks. Always do your own research.
    claims:
      - {anchor: "closed above 30,000", claim_type: market_fact}
      - {anchor: "revenue of ₹1,200 crore", claim_type: company_fact}
    not_claims: ["love auto stocks", "do your own research"]


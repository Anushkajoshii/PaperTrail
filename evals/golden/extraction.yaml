# PaperTrail golden set v1: claim extraction (10 transcripts, 28 gold claims)
#
# Each transcript lists the claims a careful human would extract. A gold claim is matched when
# an extracted quote contains `anchor` (case-insensitive) and has the same claim_type.
# `not_claims` are phrases that must NOT be extracted (opinions, greetings, advice, questions).
# Transcripts are SYNTHETIC, written to imitate common finfluencer styles; companies are fictional.

transcripts:
  - id: x01
    split: smoke
    language: hinglish
    text: >-
      Namaste doston, aaj ek multibagger ki baat karenge. Main SEBI registered advisor hoon.
      KESTREL ka target ₹1500 hai, March tak pakka jayega. Pichle saal is stock ne 40% return
      diya tha. Mere premium group mein guaranteed 5% har mahine milega. Like aur subscribe karo!
    claims:
      - {anchor: "SEBI registered advisor", claim_type: credential}
      - {anchor: "target ₹1500", claim_type: stock_call}
      - {anchor: "40% return", claim_type: past_performance}
      - {anchor: "guaranteed 5%", claim_type: return_promise}
    not_claims: ["subscribe", "Namaste doston"]

  - id: x02

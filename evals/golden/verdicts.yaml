# PaperTrail golden set v2: verdicts (95 items: 24 supported, 24 contradicted, 23 misleading,
# 24 not verifiable; 59 English, 23 Hinglish, 13 Hindi). v1 was items v001-v040.
#
# WHAT THIS IS
#   Each item is a claim plus a fixed set of evidence passages, and the verdict a careful human
#   would give USING ONLY THAT EVIDENCE. This tests the judge's reasoning separately from search.
#
# HONESTY NOTES
#   - Companies, tickers and passages are FICTIONAL (domains end in .eval.test). They imitate common
#     finfluencer claims but do not describe real companies, people or prices.
#   - Labels were assigned by one annotator (the project author) against the rubric in
#     docs/EVALUATION.md. There is no second-annotator agreement score yet.
#   - Real claims from public SEBI orders were considered and left out on purpose: they name
#     real people, and PaperTrail's test data should never attach verdicts to real individuals.
#   - split: smoke (15 items, run on every PR) | full (all 95).
#
# FIELDS
#   claim: text (English restatement), quote (original words), claim_type, tickers
#   evidence: id, url, title, source_type, published_at, snippet
#   registration (credential items only): the register lookup result to assume
#   gold_label: supported | contradicted | misleading | not_verifiable
#   gold_stances: expected stance per evidence id (for citation faithfulness)
#   why: one line explaining the label


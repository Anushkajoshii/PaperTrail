name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test (offline, mock LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPERTRAIL_LLM_PROVIDER: mock
      PAPERTRAIL_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest --cov=papertrail --cov-report=term-missing --cov-fail-under=85

  smoke-eval:
    name: Smoke eval (regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPERTRAIL_LLM_PROVIDER: mock
      PAPERTRAIL_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run 15-claim smoke eval and compare with baseline
        run: |
          uv run python -m papertrail.evaluation --split smoke --out eval-out \
            --baseline evals/baselines/mock-smoke.json --max-drop 0.05

      - name: Add report to the job summary
        if: always()
        run: cat eval-out/mock-smoke.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-eval-report
          path: eval-out/

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t papertrail:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name pt -p 8000:8000 -e PAPERTRAIL_STORE_BACKEND=memory papertrail:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
          docker rm -f pt

  lambda-image:
    name: Lambda image builds and responds (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the arm64 Lambda image
        run: docker build --provenance=false -f Dockerfile.lambda -t papertrail-lambda:ci .
      - name: Invoke it with the Lambda runtime emulator
        run: scripts/lambda_smoke.sh papertrail-lambda:ci

  infra:
    name: Terraform (format and validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
      - name: Format
        run: terraform fmt -check -recursive infra
      - name: Validate (no AWS access needed)
        run: |
          for dir in infra/bootstrap infra; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done

  web:
    name: Web app (types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: API types match the backend's OpenAPI spec
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts || (echo "::error::Run 'npm run gen:api' in web/ after changing the API" && exit 1)

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

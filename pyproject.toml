[project]
name = "papertrail"
version = "0.1.0"
description = "PaperTrail: evidence-backed fact-checking for Indian finance creators (finfluencers), with SEBI registration checks and a plain-language red-flag rulebook."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anushka Joshi" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.29.0",
    "jinja2>=3.1.6",
    "langgraph>=1.2.24",
    "mangum>=0.22.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "rapidfuzz>=3.14.6",
    "trafilatura>=2.4.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Real LLM providers are optional: the default mock provider needs none of these.
anthropic = ["anthropic>=2.14"]
bedrock = ["anthropic[bedrock]>=2.14"]
# AWS services (Transcribe, S3, DynamoDB): only needed in the cloud or with an AWS account.
aws = ["boto3>=1.35"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papertrail"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:urllib3.*",
    "ignore:SOCKS support:Warning",
    "ignore:There is no current event loop:DeprecationWarning:mangum.*",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters this way; these calls are safe as defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

# Local stack that mirrors the cloud design:
#   api    = API Gateway + API Lambda   (accepts checks, returns 202, serves results)
#   worker = SQS + worker Lambda        (runs the agent)
# They share one SQLite file on a volume (DynamoDB + SQS in AWS).
#
#   docker compose up --build      then open http://localhost:8000/docs

x-common: &common
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    PAPERTRAIL_QUEUE_MODE: sqlite
  volumes:
    - papertrail-data:/data
  restart: unless-stopped

services:
  api:
    <<: *common
    ports:
      - "8000:8000"

  worker:
    <<: *common
    command: ["python", "-m", "papertrail.worker"]
    healthcheck:
      disable: true
    depends_on:
      - api

volumes:
  papertrail-data:
